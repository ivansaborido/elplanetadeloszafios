:root{--ink:#1a1238;--cream:#fff6e0;--red:#e2362f;--gold:#ffc83a;--purple:#6b2fa8;--green:#2f9a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#120c28;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:absolute;left:50%;top:50%;transform-origin:center center;width:960px;height:540px;margin-left:-480px;margin-top:-270px;box-shadow:0 0 0 4px #000,0 10px 60px #000}
canvas{display:block;width:960px;height:540px}
.btnbar{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;z-index:30}
.btnbar button{width:44px;height:44px;border-radius:12px;border:3px solid #000;background:var(--cream);font-size:20px;box-shadow:0 3px 0 #000;cursor:pointer}
#touch{position:fixed;inset:0;pointer-events:none;z-index:20;display:none}
#touch .pad{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));pointer-events:auto;touch-action:none}
#touch .l{left:max(16px,env(safe-area-inset-left));width:216px;height:178px}
#touch .r{right:max(16px,env(safe-area-inset-right));width:200px;height:170px}
#touch button{pointer-events:none;border-radius:50%;border:4px solid rgba(0,0,0,.75);background:rgba(255,246,224,.5);font-weight:900;color:#1a1238;touch-action:none;position:absolute;font-family:inherit}
#touch .l [data-k=left]{left:0;bottom:0;width:92px;height:92px;font-size:34px}
#touch .l [data-k=right]{left:116px;bottom:0;width:92px;height:92px;font-size:34px}
#touch .l [data-k=down]{left:66px;bottom:100px;width:70px;height:70px;font-size:26px}
#touch .r #bJump{right:0;bottom:0;width:104px;height:104px;font-size:38px}
#touch .r #bAct{right:108px;bottom:62px;width:80px;height:80px;font-size:30px}
#touch button.on{background:rgba(255,200,58,.9);transform:scale(.93)}
@media (max-height:360px){#touch .l [data-k=left],#touch .l [data-k=right]{width:78px;height:78px}#touch .l [data-k=right]{left:98px}#touch .l [data-k=down]{left:54px;bottom:84px;width:62px;height:62px}#touch .r #bJump{width:90px;height:90px}#touch .r #bAct{width:70px;height:70px;right:96px;bottom:54px}}
#ov{position:fixed;inset:0;z-index:40;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(18,12,40,.72);backdrop-filter:blur(3px)}
#ov.show{display:block}
.card{max-width:780px;margin:22px auto;background:var(--cream);border:4px solid #000;border-radius:22px;box-shadow:0 8px 0 #000;padding:22px 22px 18px;position:relative}
.title{font-family:'Luckiest Guy',Impact,sans-serif;letter-spacing:1px;line-height:1;color:var(--red);text-shadow:3px 3px 0 #000;-webkit-text-stroke:1.5px #000}
h1.title{font-size:clamp(34px,7vw,64px);margin:4px 0 6px;text-align:center}
h2.title{font-size:clamp(24px,4.6vw,38px);margin:0 0 10px}
.sub{text-align:center;font-weight:800;margin:0 0 4px}
.tiny{font-size:13px;opacity:.75}
.warn{display:inline-block;background:#000;color:var(--gold);font-weight:900;border-radius:8px;padding:2px 8px;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;font-family:'Luckiest Guy',Impact,sans-serif;font-size:22px;letter-spacing:1px;padding:12px 20px;border-radius:16px;border:4px solid #000;background:var(--gold);color:#1a1238;box-shadow:0 5px 0 #000;cursor:pointer;margin:6px 4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.btn.alt{background:#fff}
.center{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.chap{border:3px solid #000;border-radius:16px;background:#fff;padding:10px;cursor:pointer;box-shadow:0 4px 0 #000;text-align:left;font-family:inherit;color:inherit}
.chap .n{font-family:'Luckiest Guy',Impact;font-size:15px;color:var(--purple)}
.chap .e{font-size:30px;line-height:1.2}
.chap .t{font-weight:900;font-size:15px;line-height:1.1}
.chap .s{font-size:12px;margin-top:3px}
.chap.lock{opacity:.45;filter:grayscale(1);cursor:not-allowed}
.story p{font-size:17px;line-height:1.45;margin:8px 0}
.who{display:flex;gap:14px;align-items:center;background:#fff;border:3px solid #000;border-radius:16px;padding:8px 12px;margin:12px 0}
.who canvas{width:84px;height:96px;flex:none}
.quote{font-style:italic;background:#ffe9b0;border-left:6px solid var(--red);padding:6px 10px;border-radius:8px;font-weight:800}
.pedia{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pe{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid #000;border-radius:14px;padding:6px 10px}
.pe canvas{width:56px;height:64px;flex:none}
.pe b{display:block;font-size:15px;line-height:1.1}
.pe span{font-size:13px;line-height:1.25;display:block}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-weight:700}
kbd{background:#fff;border:2px solid #000;border-radius:6px;padding:0 6px;font-family:inherit;font-weight:900}
.map{width:100%;max-width:520px;display:block;margin:6px auto}
.sel{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-top:8px}
.ch{position:relative;border:3px solid #000;border-radius:16px;background:#fff;padding:8px 10px 10px;cursor:pointer;box-shadow:0 4px 0 #000;text-align:left;font-family:inherit;color:inherit;display:flex;flex-direction:column;align-items:center}
.ch:active{transform:translateY(2px);box-shadow:0 2px 0 #000}
.ch canvas{width:70px;height:80px}
.ch b{font-size:14px;line-height:1.1;text-align:center;margin:2px 0 4px}
.ch .ab{font-size:12px;font-weight:900;background:#ffe9b0;border-radius:8px;padding:1px 6px;margin-bottom:5px;text-align:center}

  story:P_+'Un pequeño planeta llamado <b>Mercuriano</b> orbita la Tierra a menos de diez kilómetros. Lo fundaron unos colonos de <b>Cerro Muriano (Córdoba)</b>, que para no congelarse desarrollaron el súper poder <b>«flama pow»</b>: gritas «¡FLAMA!» y te envuelve una bola de fuego. Su rey es <b>Grego I «Cagabolitas»</b>, adicto a las moritas: cada vez que le da un retortijón se va al campo y grita <i>«¡Abono pal campoo!»</i>.'+_P+
   P_+'En la sede de la <b>Brigada de Enterados (BdE)</b>, la gran <b>Paz Ladilla</b> espera chismes de la Tierra. Sus dos únicos pilotos, <b>Toni Rodríguez</b> (cadista de Cádiz) y <b>Luis Lara</b> (más jerezano que Lola Flores), vuelan naves con forma de pepino y de nabo, fabricadas en Cerealia. Y hoy Lara trae el bombazo del año…'+_P,
  how:'Mantén pulsado <b>⤒</b> (o la flecha ↑ / espacio) para subir. Suelta para bajar. Recoge 💬 chismes y esquiva nubes de tormenta, gaviotas y la nave-pepino de Toni.',
  end:P_+'<b>¡Notición!</b> Lara se coló en un concierto en la Tierra y pilló a una invitada largándolo en la zona VIP: dentro de dos semanas hay <b>boda real en Lavalandia</b>: el rey Grego I se casa con Antonio «Naruto».'+_P+P_+'La BdE chantajea a la casa real y consigue: jornada de 8 horas, casa en Zahara para la jefa, cesta de Navidad con payoyo y palo cortao… y el <b>Muo de Jeré</b> infiltrado como organizador de la boda, con una microcámara en el botón de la camisa. ¡Y todos invitados de honor!'+_P},

  story:P_+'El reino <b>Mistery</b> está rodeado por una valla de cinco metros con concertinas afiladas. Allí casi todo son mujeres, delincuentes y drogadictos… y lo controla <b>el Comando</b>: seis primos que cobran un «impuesto revolucionario» del <b>80%</b> pa ocio y viajes.'+_P+
   P_+'Son <b>Lily</b> (el capo, bigote escobariano, habla en colombiano cuando se calienta), <b>Blacky</b> (lentillas turquesa), <b>Vary «el Colitas»</b> (el manitas), <b>Saky «Liebre II»</b>, <b>Franky</b> (gorra pa’trás) y <b>Randy «Manteka»</b>, infiltrado en Cerealia.'+_P+
   P_+'Esta mañana ha llegado un sobre real… ¡con invitación <b>solo para Lily</b>! El capo pega tiros al aire desde la terraza. Hay que reunir a los primos en el cortijo.'+_P,
  how:'Muévete con ◀ ▶, salta con ⤒. Con <b>💥 ACCIÓN</b> disparas balines de <b>pintura rosa palo</b>. También puedes aplastar a los malos saltándoles encima.',

  story:P_+'En la isla de <b>Cerealia</b>, la de los veganos (gente con menos calidad que la marca blanca del Eroski), manda <b>Doña Dorotea «la de Caballo»</b>: mezcla de reina de los Gorgs y suricato con gafas. Su marido <b>Caballo</b> no habla nunca, solo relincha. Sus hijas <b>Mariqui y Vega</b> se pasan la vida pelando alcachofas.'+_P+
   P_+'Ha llegado la invitación a la boda… con un menú <b>anti-vegano</b> diseñado a mala idea por <b>Randy «Manteka»</b> desde su restaurante Pikolo. Mientras, <b>Fali «el Capullo»</b> —48 años, ligón a base de chistes al oído— se escaquea de la cosecha del azafrán: ¡tiene que colarse en la boda!'+_P,
  how:'Con <b>💬 ACCIÓN</b> cuentas un <b>chiste</b> que deja tieso a cualquiera. Cuidado con las botellas de Randy, los ceniceros de Ruly y los galopes de Caballo.',
  end:P_+'Fali acabó con una botella de tinto en la frente (cortesía de Randy) y sin paletas (cortesía del cenicero de Ruly)… pero <b>invitado a la boda real como «yerno»</b>. A Fali le pusieron una trona astillosa pa comer; las hermanas, careta de la cerdita Peggy.'+_P+P_+'Caballo, al oír lo de «suegri», salió al galope y durmió en una cuadra. Doña Dorotea lo tiene claro: irán con su propio menú vegano en tuppers. Con alcachofas, claro.'+_P},

        {look:'bigkuki',name:'Big Kuki',lines:['¿Una invitación de unos primos? No me fío… pero voy.','Si ves a Lusy, dile que estoy de rollo con una.','Toma, una bandera pirata pa tu barca.']},

  story:P_+'El Comando, ofendido, manda <b>invitaciones falsas</b> para liarla gorda: a <b>Big Kuki</b> y sus piratas calzonazos del mar de Calzon Sea (que coincidirá con su ex, <b>Lusy «la niña del Ardilla»</b>, y su nuevo novio… ¡su hermano <b>Little Kuki</b>!), a <b>Mamazonia</b> y a <b>todos los jubilados de Jubilandia</b>.'+_P+
   P_+'El cartero será <b>Toño de la Sierra</b>, el barquero del canal de Channeka, con su barca <i>La Dorada</i>. Cada vez que cruza, los primos le gritan desde los matorrales: <i>«¡¿Y los patitooos?! ¡Cúa cuá cuá!»</i>. Y él: <i>«¡Se lo voy a decir a Ordóñez!»</i>'+_P,
  how:'Toño no tiene ataque: <b>salta encima</b> de los bichos. Ojo con el agua del río Mamazo: está llena de pirañas.',
  end:P_+'Toño repartió las invitaciones (la de Mamazonia, empapada en babas de Pelito Meado). En Jubilandia, Piter «el Chulo» le invitó a uno de sus locales… y Toño salió <b>apaleao</b> por «La loba herida» y sin la última carta.'+_P+P_+'Piter la leyó: ¡<b>todos los jubilados invitados</b> con su carnet de pensionista! Y a Piter, hombre de negocios, se le encendió la bombilla: él organizará el transporte… y así se cuela en el convite.'+_P},

        {look:'piter',name:'Piter «el Chulo»',lines:['¡Parad ya! ¡Lo conozco!','Vengo por el túnel a pedirle unas carretas rocieras al Pelusa.']}],
  story:P_+'De vuelta a Mistery por el río, Toño tiene que pasar junto a la <b>Hacienda Nápoles</b>: un cortijo a lo bestia lleno de animales exóticos, guarida del temible <b>Cártel del Pelusa</b>, una veintena de desterrados de la Tierra con su propia cárcel de lujo, <b>«La Catedral»</b> (con casino, cine y campo de fútbol con calvas).'+_P+
   P_+'Son los únicos que se niegan a pagar el 80% al Comando. El vigía de la garita da la voz de alarma: <i>«¡Por allí viene el barquero amigo de los primitos!»</i>'+_P,
  how:'Escapa de la Hacienda Nápoles hasta el túnel secreto. Cuidado con los hipopótamos y las teleras de pan que lanza «el Telera».',
  end:P_+'Piter «el Chulo» apareció por el túnel secreto (que acaba bajo su local, «La ensaimada caliente») y salvó a Toño: venía a pedirle al Pelusa las <b>carretas rocieras</b> para llevar a los jubilados a la boda.'+_P+P_+'El Pelusa soltó al barquero con un recado: <b>mañana a las 11, final de la «Vulgar Cup»</b> en La Catedral… Y al Comando, al oírlo, se le cayeron las manos a la cabeza: ¡se les había olvidado por completo!'+_P},
 {id:6,num:'Capítulo 5.2',title:'La Pachanga',icon:'⚽',mode:'pen',theme:'mistery',plook:'blacky',pname:'El Comando F.C.',
  story:P_+'Noche antes de la final, en «La ensaimada caliente»: Randy a botellazos con los porteros, los fichajes de la Tierra liándola… Por la mañana, una escena digna de <i>Resacón en Las Vegas</i>: Lily disfrazado de la gallina Caponata, Vary con trencitas de colores en la colita y Blacky sin paletas, perseguido por un <b>tigre albino</b>.'+_P+
   P_+'En La Catedral, el árbitro Jeromín acaba con la nariz doblada y el <b>Muo de Jeré</b> le quita el pito. Entradas en plancha, pausa de hidratación con litronas, granizada… <b>1-1</b>. Todo se decide en una tanda de <b>tres penaltis</b>.'+_P,
  how:'<b>Cuando chutas:</b> toca la pantalla (o espacio) para fijar la dirección y otra vez para la altura. ¡Si te pasas del larguero, a las nubes!<br><b>Cuando paras:</b> elige dónde tirarte tocando la izquierda, el centro o la derecha de la portería (o ← ↑ →).',
  end:P_+'<b>¡El Comando, campeón de la Vulgar Cup</b> en casa de su máximo rival! Blacky, que era malísimo tirando penaltis, la metió <b>de tacón</b>. Piter entrega el trofeo de oro macizo: dos manos levantando el planeta Mercuriano.'+_P+P_+'En la barbacoa, el Pelusa propone un trato: si les llevan a la boda en sus avionetas, empezarán a pagar el 80%. <i>—¿Salivita en la mano? —Salivita.</i> Lo que Lily no sabe: el Cártel va a por <b>la corona y el oro del rey</b>…'+_P},

    else if('eEFTj'.indexOf(c)>=0){const spec=d.en&&d.en[c];grid[y][x]='.';if(spec){counters[c]=(counters[c]||0);const sk=spec.skins[counters[c]%spec.skins.length];counters[c]++;L.enemies.push(makeEnemy(spec,sk,x,y));}}
  }
  L.grid=grid;
  L.p={x:L.start.x,y:L.start.y,w:26,h:46,vx:0,vy:0,face:1,onGround:false,coyote:0,jbuf:0,hearts:3,maxH:5,inv:60,cool:0,dbl:false,anim:0,rx:L.start.x,ry:L.start.y,
       ride:null,big:!!ch.tough,fire:false,star:0,roll:false,crouch:false,spin:0,dash:0,dead:false,deadT:0,springT:0,swing:0,rot:0};
  if(L.p.big){L.p.h=58;L.p.y-=12;}
  if(d.mode==='fly'){L.p.w=46;L.p.h=26;L.p.y=6*T;L.p.x=3*T;L.camy=10;L.p.big=false;}
  if(d.mode==='boss'){L.time=999*60;}
  setActIcon();
}
function makeEnemy(spec,sk,tx,ty){
  const isP=!!sk.look;const w=isP?26:Math.round((sk.size||36)*0.8),h=isP?46:Math.round((sk.size||36)*0.75);
  const e={spec,sk,kind:spec.kind,x:tx*T+(T-w)/2,y:(ty+1)*T-h,w,h,vx:0,vy:0,face:-1,dead:false,dt:0,t:Math.random()*200,bx:tx*T,by:ty*T,state:0,st:0,talk:Math.random()*200,bubble:null,onGround:false,dir:-1};
  if(e.kind==='flyer'||e.kind==='diver'){e.y=ty*T;e.by=ty*T;}
  if(e.kind==='jumper'){e.by=11*T+6;e.y=e.by;e.st=Math.random()*80;}
  if(e.kind==='thrower'){e.st=Math.random()*60;}
  return e;
}
function makeBoss(x,y){return {x:x,y:y-52,w:34,h:52,vx:0,vy:0,hp:14,maxhp:14,state:'intro',st:0,face:-1,onGround:false,flash:0,calm:false,bubble:{text:'¡¡FLAMA POWEEEER!!',t:150},talk:200};}

function tileAt(tx,ty){if(ty<0||ty>=L.rows)return '.';if(tx<0||tx>=L.cols)return '#';return L.grid[ty][tx];}
function moveBody(b){
  b.x+=b.vx;let x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-.01)/T),y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-.01)/T);b.hitWall=false;
  if(b.vx>0){for(let ty=y0;ty<=y1;ty++)if(solid(tileAt(x1,ty))){b.x=x1*T-b.w;b.vx=0;b.hitWall=true;break;}}
  else if(b.vx<0){for(let ty=y0;ty<=y1;ty++)if(solid(tileAt(x0,ty))){b.x=(x0+1)*T;b.vx=0;b.hitWall=true;break;}}
  const pb=b.y+b.h;b.y+=b.vy;b.onGround=false;b.hitHead=null;
  x0=Math.floor(b.x/T);x1=Math.floor((b.x+b.w-.01)/T);y0=Math.floor(b.y/T);y1=Math.floor((b.y+b.h-.01)/T);
  if(b.vy>0){for(let tx=x0;tx<=x1;tx++){const c=tileAt(tx,y1);if(solid(c)||(c==='='&&pb<=y1*T+1)){b.y=y1*T-b.h;b.vy=0;b.onGround=true;break;}}}
  else if(b.vy<0){let best=null,bd=1e9;const cx=b.x+b.w/2;for(let tx=x0;tx<=x1;tx++)if(solid(tileAt(tx,y0))){const dd=Math.abs(tx*T+T/2-cx);if(dd<bd){bd=dd;best=tx;}}
    if(best!==null){b.y=(y0+1)*T;b.vy=0;b.hitHead={tx:best,ty:y0};}}
}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function overlapTile(b,ch,inset){const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-1)/T),y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-1)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(tileAt(tx,ty)===ch){const r={x:tx*T+inset.x,y:ty*T+inset.y,w:T-inset.x*2,h:T-inset.y};if(ov(b,r))return true;}return false;}

function burst(x,y,col,n){for(let i=0;i<(n||10);i++)L.parts.push({x,y,vx:rnd(-3,3),vy:rnd(-5,1),l:30+Math.random()*20,c:col||'#fff',s:rnd(3,6)});}
function ftext(x,y,s,col){L.texts.push({x,y,s,l:60,c:col||'#fff'});}
function addScore(n,x,y){L.score+=n;if(x!==undefined)ftext(x,y,String(n),'#fff');}
function addRings(n){const before=Math.floor(L.rings/100);L.rings+=n;L.got+=n;L.score+=10*n;if(Math.floor(L.rings/100)>before){L.lives++;SFX.oneup();ftext(L.p.x+13,L.p.y-30,'¡1 VIDA!','#7aff9a');}}

/* ---------- daño y muerte ---------- */
function hurt(fromX){
  const p=L.p;if(L.done||p.dead)return;
  if(L.def.mode==='fly'){if(p.inv>0)return;p.hearts--;p.inv=90;p.vy=-5;SFX.hit();L.shake=10;burst(p.x+p.w/2,p.y+10,'#ff4a4a',12);if(p.hearts<=0)gameOver();return;}
  if(p.inv>0||p.star>0)return;
  L.shake=8;
  if(p.ride){dismount(true);p.inv=110;p.vy=-8;SFX.shrink();return;}
  if(p.big){p.big=false;p.fire=false;p.inv=110;SFX.shrink();ftext(p.x+13,p.y-20,'¡Ay!','#ffb0b0');return;}
  if(L.rings>0){scatterRings();p.inv=110;p.vy=-7;p.vx=(p.x+p.w/2<fromX?-4:4);p.roll=false;SFX.ringloss();return;}
  die();
}
function scatterRings(){const p=L.p;const n=Math.min(L.rings,24);for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2,s=3+(i%3)*1.6;L.loose.push({x:p.x+p.w/2,y:p.y+p.h/2,vx:Math.cos(a)*s,vy:-Math.abs(Math.sin(a))*s-2,l:320,ready:35});}L.rings=0;}
function dismount(hit){const p=L.p;if(!p.ride)return;const R=RIDES[p.ride.type];L.parts.push({x:p.x,y:p.y+20,vx:hit?-p.face*5:0,vy:-6,l:70,c:'#888',s:2,emo:R.e||'🥒'});ftext(p.x+13,p.y-20,hit?'¡Te has caído!':'¡Se acabó el viaje!','#ffb0b0');p.ride=null;p.dbl=true;}
function die(){const p=L.p;if(p.dead||L.done)return;p.dead=true;p.deadT=0;p.vy=-11;p.vx=0;p.roll=false;SFX.die();L.shake=10;}
function afterDeath(){const p=L.p;L.lives--;if(L.lives<=0){gameOver();return;}
  p.ride=null;p.dead=false;p.x=p.rx;p.y=p.ry;p.vx=0;p.vy=0;p.inv=100;p.big=!!L.ch.tough;p.fire=false;p.star=0;p.roll=false;p.crouch=false;p.h=46;if(p.big){p.h=58;p.y-=12;}
  L.rings=0;L.loose=[];L.camx=clamp(p.x-W*.4,0,L.w-W);}

   ACTUALIZACIÓN
   ========================================================= */
function update(){
  if(!L||L.def.mode==='pen')return;
  L.t++;const d=L.def,p=L.p;
  if(L.shake>0)L.shake--;
  if(d.mode==='fly')updateFly();else updatePlat();
  const tick=L.slow>0?(L.t%2===0):true;
  if(tick){for(const e of L.enemies)updateEnemy(e);if(L.boss)updateBoss();}
  L.enemies=L.enemies.filter(e=>!(e.dead&&e.dt>90));
  // proyectiles jugador
  for(const b of L.pproj){b.x+=b.vx;b.y+=b.vy||0;b.l--;b.rot=(b.rot||0)+.35;
    if(d.mode!=='fly'){const c=tileAt(Math.floor(b.x/T),Math.floor(b.y/T));if(solid(c)){b.l=0;burst(b.x,b.y,b.col,6);}}
    for(const e of L.enemies){if(!e.dead&&b.l>0&&ov({x:b.x-12,y:b.y-12,w:24,h:24},e)){killEnemy(e);b.l=0;}}
    if(L.boss&&!L.boss.calm&&b.l>0&&ov({x:b.x-12,y:b.y-12,w:24,h:24},L.boss)){hitBoss();b.l=0;}
  }
  L.pproj=L.pproj.filter(b=>b.l>0);
  // proyectiles enemigos
  if(tick){for(const b of L.eproj){b.x+=b.vx;b.y+=b.vy;b.vy+=b.g||0;b.l--;b.rot=(b.rot||0)+.2;
    if(!p.dead&&ov({x:b.x-11,y:b.y-11,w:22,h:22},p)){if(p.star>0||p.dash>0){b.l=0;burst(b.x,b.y,'#fff',6);}else{hurt(b.x);b.l=0;}}
    if(b.y>H+80)b.l=0;}}
  L.eproj=L.eproj.filter(b=>b.l>0);
  // objetos
  for(const it of L.items){if(it.got)continue;const r={x:it.x-16,y:it.y-16,w:32,h:32};
    if(!p.dead&&ov(r,p)){it.got=true;
      if(it.k==='coin'){if(d.mode==='fly'){L.got++;L.score+=10;SFX.coin();if(d.fuel)L.fuel=Math.min(100,L.fuel+16);}else{addRings(1);SFX.coin();}burst(it.x,it.y,'#ffe066',4);}
      else{SFX.heal();if(d.mode==='fly'){if(p.hearts<p.maxH)p.hearts++;ftext(it.x,it.y-10,'+❤','#ff8a8a');}else if(!p.big){grow();}else{addRings(10);ftext(it.x,it.y-10,'+10','#ffe066');}}}}
  // moritas sueltas
  for(const r of L.loose){r.vy+=.28;r.x+=r.vx;r.y+=r.vy;r.l--;if(r.ready>0)r.ready--;
    const c=tileAt(Math.floor(r.x/T),Math.floor((r.y+9)/T));if(r.vy>0&&solid(c)){r.y=Math.floor((r.y+9)/T)*T-9;r.vy*=-.72;r.vx*=.9;}
    const cs=tileAt(Math.floor((r.x+(r.vx>0?9:-9))/T),Math.floor(r.y/T));if(solid(cs))r.vx*=-1;
    if(r.ready<=0&&!p.dead&&ov({x:r.x-12,y:r.y-12,w:24,h:24},p)){r.l=0;addRings(1);SFX.coin();}}
  L.loose=L.loose.filter(r=>r.l>0&&r.y<ROWS*T+40);
  // monedas que saltan de bloques
  for(const q of L.pops){q.y+=q.vy;q.vy+=.6;q.l--;}L.pops=L.pops.filter(q=>q.l>0);
  for(const b of L.bumps)b.t--;L.bumps=L.bumps.filter(b=>b.t>0);
  for(const s of L.springs)if(s.t>0)s.t--;
  updatePows();
  for(const q of L.parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.25;q.l--;}L.parts=L.parts.filter(q=>q.l>0);
  for(const q of L.texts){q.y-=.8;q.l--;}L.texts=L.texts.filter(q=>q.l>0);
  for(const n of L.npcs){const dx=(p.x+p.w/2)-n.x;n.near=Math.abs(dx)<170&&Math.abs((p.y+p.h)-n.y)<160;n.face=dx>0?1:-1;
    if(n.near){if(!n.wasNear){n.lt=0;if(n.d.cua)SFX.cua();}n.lt++;if(n.lt>200){n.lt=0;n.li=(n.li+1)%n.d.lines.length;if(n.d.cua)SFX.cua();}}n.wasNear=n.near;}
  if(d.radio&&L.radioI<d.radio.length&&p.x/L.w>=d.radio[L.radioI].at){L.radio=Object.assign({},d.radio[L.radioI],{t:240});L.radioI++;beep(1200,.05,'square',.03);}
  if(L.radio){L.radio.t--;if(L.radio.t<=0)L.radio=null;}
  if(L.done&&d.mode!=='plat'){L.doneT++;if(L.doneT===(L.boss?220:90))levelComplete();}
}

function setActIcon(){const b=document.getElementById('bAct');if(!L)return;
  if(L.def.mode==='fly'){b.style.visibility='hidden';return;}
  b.style.visibility='visible';b.textContent=L.p&&L.p.fire?'🔥':L.ch.abi;}

function grow(){const p=L.p;if(!p.big){p.big=true;SFX.grow();ftext(p.x+13,p.y-24,'¡SÚPER!','#ffe066');}}

function bumpBlock(tx,ty){
  const c=L.grid[ty][tx];const p=L.p;
  L.bumps.push({tx,ty,t:10});
  for(const e of L.enemies)if(!e.dead&&Math.abs((e.y+e.h)-ty*T)<6&&e.x+e.w>tx*T&&e.x<tx*T+T)killEnemy(e);
  if(c==='?'){L.grid[ty][tx]='U';L.pops.push({x:tx*T+20,y:ty*T-10,vy:-9,l:26});addRings(1);SFX.coin();}
  else if('MFSL'.indexOf(c)>=0){L.grid[ty][tx]='U';let k=c;if(k==='M'&&p.big)k='F';L.pows.push({k,x:tx*T+5,y:ty*T,w:30,h:30,vx:0,vy:0,emerge:30,dir:p.face||1});SFX.power();}
  else if(c==='K'){if(p.big||p.roll){breakBrick(tx,ty);}else SFX.bump();}
  else SFX.bump();
}
function breakBrick(tx,ty){L.grid[ty][tx]='.';SFX.brk();addScore(50);for(let i=0;i<4;i++)L.parts.push({x:tx*T+10+(i%2)*20,y:ty*T+10+Math.floor(i/2)*20,vx:(i%2?2.5:-2.5),vy:-7-Math.random()*3,l:60,c:'#b5482c',s:12});}
function updatePows(){const p=L.p;
  for(const w of L.pows){
    if(w.emerge>0){w.emerge--;w.y-=1;continue;}
    if(w.k==='M'||w.k==='L'){w.vx=2*w.dir;w.vy+=.5;moveBody(w);if(w.hitWall)w.dir*=-1;}
    else if(w.k==='S'){w.vx=3*w.dir;w.vy+=.45;moveBody(w);if(w.hitWall)w.dir*=-1;if(w.onGround)w.vy=-9;}
    if(w.y>ROWS*T+40)w.gone=true;
    if(!p.dead&&!w.gone&&ov(w,p)){w.gone=true;addScore(1000,w.x+15,w.y);
      if(w.k==='M'){grow();}
      else if(w.k==='F'){p.big=true;p.fire=true;SFX.power();ftext(p.x+13,p.y-24,'¡FLOR DE FLAMA!','#ffb03a');setActIcon();}
      else if(w.k==='S'){p.star=600;SFX.power();ftext(p.x+13,p.y-24,'¡BREBAJE MÁGICO!','#7affea');}
      else if(w.k==='L'){L.lives++;SFX.oneup();ftext(p.x+13,p.y-24,'¡1 VIDA!','#7aff9a');}}}
  L.pows=L.pows.filter(w=>!w.gone);}

function useAbility(){
  const p=L.p;const ab=p.fire?'flama':L.ch.ab;
  const shoot=(k,spd,cool,col)=>{p.cool=cool;const b={x:p.x+p.w/2+p.face*16,y:p.y+(p.big?22:18),vx:p.face*spd,l:60,k,col};
    if(k==='chiste'){b.txt=['¿Sabes el del…?','¡Jajaja!','Van un vegano y…','¡Toma chiste!','¿Qué le dice…?'][Math.floor(Math.random()*5)];}
    L.pproj.push(b);k==='flama'?SFX.flama():SFX.shoot();};
  switch(ab){
    case 'paint':shoot('paint',11,13,'#ff8ac0');break;
    case 'chiste':shoot('chiste',8,17,'#fff');break;
    case 'flama':shoot('flama',9,20,'#ff7a1a');ftext(p.x+13,p.y-20,'¡FLAMA!','#ffb03a');break;
    case 'ninja':shoot('ninja',12,13,'#ffe066');break;
    case 'remo':{p.cool=22;p.swing=14;SFX.shoot();const r={x:p.face>0?p.x+p.w-4:p.x-58,y:p.y-6,w:62,h:p.h+6};
      for(const e of L.enemies)if(!e.dead&&ov(r,e))killEnemy(e);
      if(L.boss&&!L.boss.calm&&ov(r,L.boss))hitBoss();
      const x0=Math.floor(r.x/T),x1=Math.floor((r.x+r.w)/T),y0=Math.floor(r.y/T),y1=Math.floor((r.y+r.h-1)/T);
      for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(tileAt(tx,ty)==='K')breakBrick(tx,ty);break;}
    case 'sprint':p.cool=75;p.dash=42;p.vx=p.face*15;SFX.dash();burst(p.x+13,p.y+p.h,'#fff',12);ftext(p.x+13,p.y-20,'¡ACELERÓN!','#7affea');break;
    case 'highjump':if(p.onGround){p.cool=40;p.vy=-19;p.springT=18;SFX.spring();burst(p.x+13,p.y+p.h,'#fff',10);}break;
    case 'unga':{p.cool=140;L.shake=12;SFX.hit();ftext(p.x+13,p.y-30,'¡UNGA UNGA!','#ffe066');for(const e of L.enemies)if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<190)killEnemy(e);
      if(L.boss&&!L.boss.calm&&Math.hypot(L.boss.x-p.x,L.boss.y-p.y)<190)hitBoss();for(let i=0;i<16;i++){const a=i/16*6.28;L.parts.push({x:p.x+13,y:p.y+20,vx:Math.cos(a)*6,vy:Math.sin(a)*6,l:25,c:'#ffe066',s:5});}break;}
    case 'futuro':p.cool=560;L.slow=260;SFX.rev();ftext(p.x+13,p.y-30,'¡Veo el futuro!','#c9a0ff');break;
  }
}

function updatePlat(){
  const p=L.p,ch=L.ch;
  if(p.dead){p.deadT++;p.vy+=.5;p.y+=p.vy;if(p.deadT>110)afterDeath();return;}
  if(p.inv>0)p.inv--;if(p.cool>0)p.cool--;if(p.star>0)p.star--;if(p.dash>0)p.dash--;if(L.slow>0)L.slow--;if(p.swing>0)p.swing--;
  if(!L.done&&L.def.mode==='plat'){L.time--;if(L.time<=0){L.time=400*60;die();return;}}
  if(L.done){goalSequence();return;}
  const onG=p.onGround;
  const R=p.ride?RIDES[p.ride.type]:null;
  if(R){p.ride.t--;if(p.ride.t<=0)dismount(false);}
  const maxS=(R?R.spd:ch.spd)*(p.star>0?1.2:1);
  if(R){p.crouch=false;p.roll=false;p.spin=0;}
  // agacharse / carga de rodar
  if(!R&&onG&&keys.down&&!p.roll&&Math.abs(p.vx)<1.5){
    p.crouch=true;p.vx*=.82;
    if(pressed.jump){p.spin=Math.min(14,p.spin+3.6);SFX.rev();burst(p.x+p.w/2-p.face*14,p.y+p.h,'#fff',5);}
    p.spin*=.985;
  }else{
    if(p.crouch&&p.spin>.5){p.roll=true;p.vx=p.face*(8+p.spin);SFX.dash();burst(p.x+p.w/2,p.y+p.h,'#fff',10);}
    p.crouch=false;p.spin=0;
  }
  if(!R&&onG&&keys.down&&Math.abs(p.vx)>=2.6&&!p.roll){p.roll=true;SFX.roll();}
  if(p.roll){if(onG){p.vx*=.993;if(keys.left&&p.vx>0)p.vx-=.14;if(keys.right&&p.vx<0)p.vx+=.14;}
    if(onG&&Math.abs(p.vx)<1.3)p.roll=false;p.face=p.vx>0?1:p.vx<0?-1:p.face;}
  else if(!p.crouch){
    const a=(R?R.acc:ch.acc)*(onG||(R&&R.fly)?1:.8);
    if(keys.right){if(p.vx<0)p.vx+=onG?.75:.4;else if(p.vx<maxS)p.vx=Math.min(maxS,p.vx+a);p.face=1;}
    else if(keys.left){if(p.vx>0)p.vx-=onG?.75:.4;else if(p.vx>-maxS)p.vx=Math.max(-maxS,p.vx-a);p.face=-1;}
    else{const f=onG?.3:.03;if(Math.abs(p.vx)<=f)p.vx=0;else p.vx-=Math.sign(p.vx)*f;}
    if(Math.abs(p.vx)>maxS&&onG&&p.dash<=0)p.vx-=Math.sign(p.vx)*.14;
  }
  p.skid=onG&&!p.roll&&((keys.right&&p.vx<-3)||(keys.left&&p.vx>3));
  if(p.skid&&L.t%3===0)L.parts.push({x:p.x+p.w/2,y:p.y+p.h-2,vx:-p.vx*.2,vy:-1,l:18,c:'#ddd',s:5});
  // salto
  if(pressed.jump&&!p.crouch)p.jbuf=8;else if(p.jbuf>0)p.jbuf--;
  if(onG){p.coyote=7;p.dbl=true;L.combo=0;}else if(p.coyote>0)p.coyote--;
  if(R&&R.fly){if(keys.jump||keys.up)p.vy-=.78;else p.vy+=.34;if(keys.down)p.vy+=.4;p.vy=clamp(p.vy,-6.5,6.5);if(p.y<36){p.y=36;p.vy=Math.max(0,p.vy);}if(L.t%4===0)L.parts.push({x:p.x+p.w/2-p.face*30,y:p.y+p.h-8,vx:-p.face*2,vy:rnd(0,1),l:16,c:'#ff9a1a',s:5});}
  else{
  const jv=R?R.jump:ch.jump;

let PEN=null;
const GL=300,GR=660,GT=170,GB=330;
function startPenalties(){
  PEN={turns:[{side:'them',name:'«El Telera»',look:'telera',script:'nubes'},{side:'us',name:'Saky',look:'saky'},{side:'them',name:'«El Aceitunero»',look:'maton'},{side:'us',name:'Vary',look:'vary'},{side:'them',name:'«El Pelusa»',look:'pelusa'},{side:'us',name:'Blacky',look:'blacky',tacon:true}],
    i:0,phase:'intro',t:0,us:[],them:[],ax:GL,ay:GT,adir:1,kz:1,kpick:-1,ball:null,res:'',extra:0,over:false,flash:0};
  mode='pen';setTouchVisible();
}
function penTurn(){return PEN.turns[PEN.i];}
function zoneOf(x){return x<420?0:x>540?2:1;}
function penAction(zone){
  if(!PEN)return;const tr=penTurn();if(!tr)return;
  if(tr.side==='us'){
    if(PEN.phase==='aimX'){PEN.phase='aimY';PEN.t=0;beep(700,.05,'square',.04);}
    else if(PEN.phase==='aimY'){PEN.target={x:PEN.ax,y:PEN.ay};PEN.kz=Math.floor(Math.random()*3);PEN.phase='fly';PEN.t=0;SFX.shoot();}
  }else if(PEN.phase==='keep'&&PEN.kpick<0){PEN.kpick=zone;penShootThem();}
}
function penShootThem(){const tr=penTurn();let z=Math.floor(Math.random()*3);let tx=[GL+60,480,GR-60][z]+rnd(-30,30),ty=rnd(GT+30,GB-30);
  if(tr.script==='nubes'){tx=480+rnd(-80,80);ty=-60;}
  PEN.target={x:tx,y:ty};PEN.shotZ=z;PEN.kz=PEN.kpick<0?1:PEN.kpick;PEN.phase='fly';PEN.t=0;SFX.shoot();}
function updatePenalties(){
  const P=PEN;P.t++;const tr=penTurn();
  if(P.phase==='intro'){if(P.t>70){P.phase=tr.side==='us'?'aimX':'keep';P.t=0;P.kpick=-1;P.ax=GL-30;P.ay=GT-20;}}
  else if(P.phase==='aimX'){P.ax+=P.adir*7.5;if(P.ax>GR+35){P.adir=-1;}if(P.ax<GL-35){P.adir=1;}}
  else if(P.phase==='aimY'){P.ay=GT-40+(Math.sin(P.t*.07-Math.PI/2)*.5+.5)*(GB-GT+40);}
  else if(P.phase==='keep'){if(P.t>110&&P.kpick<0){P.kpick=1;penShootThem();}}
  else if(P.phase==='fly'){if(P.t>=36){P.phase='res';P.t=0;
      let r;const tx=P.target.x,ty=P.target.y;
      if(tr.side==='us'){
        if(tx<GL+4||tx>GR-4||ty<GT+4){r='fuera';}
        else{const z=zoneOf(tx);if(z===P.kz&&Math.random()<(z===1?.8:.7))r='parada';else r='gol';}
        P.us.push(r==='gol');
      }else{
        if(tr.script==='nubes')r='nubes';
        else if(P.kz===P.shotZ&&Math.random()<.85)r='parada';else if(Math.random()<.1)r='fuera';else r='gol';
        P.them.push(r==='gol');
      }
      P.res=r;if(r==='gol'){tr.side==='us'?SFX.gol():SFX.hit();}else{tr.side==='us'?SFX.hit():SFX.gol();}
    }}
  else if(P.phase==='res'){if(P.t>110){
      P.i++;const ug=P.us.filter(Boolean).length,tg=P.them.filter(Boolean).length;
      if(P.i>=P.turns.length){
        if(P.us.length===P.them.length&&ug!==tg){penEnd(ug>tg);return;}
        if(P.us.length===P.them.length){const names=['Lily','Randy','Franky'];const k=P.extra++%3;P.turns.push({side:'them',name:'Matón del Cártel',look:'maton'},{side:'us',name:names[k],look:['lily','randy','franky'][k]});}
      }
      P.phase='intro';P.t=0;}}
  else if(P.phase==='end'){if(P.t===150){P.won?levelComplete():penLose();}}
}

const NARR={on:true,voice:null,busy:0};
try{const v=localStorage.getItem('zafios_narr');if(v!==null)NARR.on=v==='1';}catch(e){}
function pickVoice(){try{if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();NARR.voice=vs.find(v=>/^es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
const capTTS=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.TextToSpeech;
function cleanSpeech(t){return t.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu,'').replace(/[«»“”"]/g,'').replace(/—/g,', ').replace(/…/g,'... ').replace(/\s+/g,' ').trim();}
function htmlToText(h){const d=document.createElement('div');d.innerHTML=h;d.querySelectorAll('p,h2,div').forEach(n=>n.append(' . '));return d.textContent;}
function say(text,o){o=o||{};if(!NARR.on||!text)return;const t=cleanSpeech(text);if(!t)return;
  const now=performance.now();if(o.ifIdle&&now<NARR.busy)return;
  NARR.busy=now+t.length*62/(o.rate||1)+400;
  const cp=capTTS();
  if(cp){try{if(o.interrupt!==false)cp.stop().catch(()=>{});cp.speak({text:t,lang:'es-ES',rate:o.rate||1,pitch:o.pitch||1,volume:1,category:'playback'}).catch(()=>{});}catch(e){}return;}
  if(!('speechSynthesis' in window))return;
  try{if(o.interrupt!==false)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';if(NARR.voice)u.voice=NARR.voice;u.rate=o.rate||1.02;u.pitch=o.pitch||1;speechSynthesis.speak(u);}catch(e){}
}
function hush(){NARR.busy=0;const cp=capTTS();if(cp){try{cp.stop().catch(()=>{});}catch(e){}}if('speechSynthesis' in window){try{speechSynthesis.cancel();}catch(e){}}}
const VOICES={Caballo:.4,'Pelito':1.5,'Blippi':1.8,'Élder':1.9,'Matilde':.7,'Dorotea':1.25,'Mariqui':1.45,'Vega':1.6,'Lusy':1.4,'Paz':1.35,'Naruto':1.3,'Big Kuki':.6,'Pelusa':.75,'Lily':.75,'Randy':.85,'Toni':1.05,'Luis':.95,'Jubilad':.7,'pirata':.8,'Juarma':1.15,'Comando':1.5,'gaviota':1.9,'loro':1.8};
function pitchFor(name){if(!name)return 1;for(const k in VOICES)if(name.indexOf(k)>=0)return VOICES[k];return .95;}
function setNarrBtn(){const b=document.getElementById('bNarr');if(b)b.textContent=NARR.on?'🗣️':'🤐';}

function portrait(look,w,h,emoji){const cv2=document.createElement('canvas');cv2.width=w*2;cv2.height=h*2;const c=cv2.getContext('2d');c.scale(2,2);
  if(emoji){emo(c,emoji,w/2,h/2,Math.min(w,h)*.7);}else{const o=LOOKS[look];const sc=(h/58)/(o.scale||1);c.save();c.translate(w/2,h-3);c.scale(sc,sc);drawPerson(c,0,0,o,1,0,false);c.restore();}return cv2;}
function showOverlay(html,handlers){OV.innerHTML=html;OV.classList.add('show');OV.scrollTop=0;Object.keys(handlers||{}).forEach(id=>{const el=document.getElementById(id);if(el)el.onclick=(ev)=>{ev.stopPropagation();initAudio();handlers[id]();};});setTouchVisible();}
function hideOverlay(){OV.classList.remove('show');OV.innerHTML='';setTouchVisible();}
let TB=[];
function setTouchVisible(){const tv=isTouch&&!OV.classList.contains('show')&&mode==='play'&&!paused;document.getElementById('touch').style.display=tv?'block':'none';
  const fly=!!(L&&L.def&&L.def.mode==='fly');document.querySelector('#touch .l').style.display=fly?'none':'block';
  TB.forEach(b=>{b.classList.remove('on');keys[b.dataset.k]=false;});
  document.getElementById('bPause').style.visibility=(mode==='play'||mode==='pen')?'visible':'hidden';}

let lastSpoken=null;
function narrateTick(){
  if(!NARR.on||mode!=='play'||!L||paused)return;
  for(const n of L.npcs){if(n.near){const key=n.d.name+'|'+n.li;if(key!==lastSpoken){lastSpoken=key;say(n.d.lines[n.li],{pitch:pitchFor(n.d.name)});}return;}}
  if(L.radio&&L.radio.t===239){say(L.radio.text,{pitch:pitchFor(L.radio.who)});return;}
  for(const e of L.enemies){if(e.bubble&&e.bubble.t===129&&!e.dead){say(e.bubble.text,{pitch:pitchFor(e.sk.name),ifIdle:true,interrupt:false});return;}}
  if(L.boss&&L.boss.bubble&&L.boss.bubble.t===(L.boss.calm?399:119)){say(L.boss.bubble.text,{pitch:1.3,interrupt:L.boss.calm});}
}

const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',KeyZ:'jump',KeyX:'act',KeyJ:'act',Enter:'act',KeyK:'act'};
window.addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){togglePause();return;}
  const k=KM[e.code];if(!k)return;if(OV.classList.contains('show'))return;e.preventDefault();initAudio();
  if(mode==='pen'&&!paused){if(e.repeat)return;const P=PEN;if(P&&penTurn()&&penTurn().side==='them'&&P.phase==='keep'){if(k==='left')penAction(0);else if(k==='right')penAction(2);else if(k==='up'||k==='jump'||k==='act')penAction(1);}else if(k==='jump'||k==='act'||k==='up')penAction(1);return;}
  if(k==='up'){if(!keys.jump)pressed.jump=true;keys.up=true;keys.jump=true;return;}
  if((k==='jump'||k==='act')&&!keys[k])pressed[k]=true;keys[k]=true;
});
window.addEventListener('keyup',e=>{const k=KM[e.code];if(!k)return;if(k==='up'){keys.up=false;keys.jump=false;return;}keys[k]=false;});
TB=[...document.querySelectorAll('#touch button')];
function touchSync(e){e.preventDefault();initAudio();
  const act={};for(const t of e.touches){for(const b of TB){if(b.offsetParent===null)continue;const r=b.getBoundingClientRect();const m=14;
    if(t.clientX>=r.left-m&&t.clientX<=r.right+m&&t.clientY>=r.top-m&&t.clientY<=r.bottom+m){act[b.dataset.k]=true;}}}
  for(const b of TB){const k=b.dataset.k,on=!!act[k];if(on&&!keys[k]&&(k==='jump'||k==='act'))pressed[k]=true;keys[k]=on;b.classList.toggle('on',on);}}
document.querySelectorAll('#touch .pad').forEach(pd=>{['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>pd.addEventListener(ev,touchSync,{passive:false}));});
cv.addEventListener('pointerdown',e=>{initAudio();if(mode!=='pen'||paused)return;const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;penAction(x<GL+120?0:x>GR-120?2:1);});
document.getElementById('bPause').onclick=e=>{e.stopPropagation();togglePause();};
document.getElementById('bMute').onclick=e=>{e.stopPropagation();muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';};
(function(){const bar=document.querySelector('.btnbar');const b=document.createElement('button');b.id='bNarr';b.title='Narrador';bar.insertBefore(b,bar.firstChild);setNarrBtn();
  b.onclick=e=>{e.stopPropagation();initAudio();NARR.on=!NARR.on;try{localStorage.setItem('zafios_narr',NARR.on?'1':'0');}catch(err){}setNarrBtn();if(NARR.on)say('Narrador activado');else hush();};})();
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(mode==='play'&&!paused)togglePause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();if(mode==='play'&&!paused)togglePause();}});

function fit(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);app.style.transform='scale('+s+')';checkRot();}
let rotIgnore=false;
function checkRot(){const r=document.getElementById('rot');const show=isTouch&&!rotIgnore&&window.innerHeight>window.innerWidth*1.05&&(mode==='play'||mode==='pen');r.style.display=show?'flex':'none';}
document.getElementById('rotGo').onclick=()=>{rotIgnore=true;checkRot();};
window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,200));
function goFull(){initAudio();if(!isTouch||window.Capacitor)return;try{const d=document.documentElement;const rq=d.requestFullscreen||d.webkitRequestFullscreen;if(rq&&!document.fullscreenElement){const pr=rq.call(d);if(pr&&pr.then)pr.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}}catch(e){}}

let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(100,now-last);last=now;acc+=dt;
  while(acc>=1000/60){acc-=1000/60;frame++;
    if(!paused){if(mode==='play'){update();narrateTick();}else if(mode==='pen'&&PEN)updatePenalties();}
    pressed.jump=false;pressed.act=false;
  }
  render();requestAnimationFrame(loop);
}
fit();showMenu();requestAnimationFrame(loop);
if(/^https?:/.test(location.protocol)&&!window.Capacitor){
  try{if(!document.querySelector('link[rel=manifest]')){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);}
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
}
document.addEventListener('backbutton',()=>{if(mode==='play')togglePause();},false);
