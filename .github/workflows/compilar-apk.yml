name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'android-proyecto/**', '.github/workflows/**' ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar Capacitor
        working-directory: android-proyecto
        run: npm ci
      - name: Compilar APK
        working-directory: android-proyecto/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Los-Zafios-APK
          path: android-proyecto/android/app/build/outputs/apk/debug/app-debug.apk
