name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'android-proyecto/**', '.github/workflows/**' ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar Capacitor
        working-directory: android-proyecto
        run: |
          npm ci
          npx cap sync android
      - name: Compilar APK
        working-directory: android-proyecto/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || { grep -E "error|What went wrong|Could not|failed|FAIL" -A3 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=Fallo al compilar::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Los-Zafios-APK
          path: android-proyecto/android/app/build/outputs/apk/debug/app-debug.apk
